global:
  scrape_interval: 15s      # How frequently to scrape targets by default
  evaluation_interval: 15s  # How frequently to evaluate recording and alert rules

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitor Aegis FastAPI service
  - job_name: "aegis-api"
    metrics_path: "/metrics"
    scrape_interval: 5s     # Higher resolution scraping for real-time latency & metrics
    static_configs:
      - targets: ["aegis-api:8000"]