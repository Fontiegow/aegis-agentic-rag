apiVersion: v1
kind: Namespace
metadata:
  name: aegis-system
  labels:
    app.kubernetes.io/name: aegis-agentic-rag
    app.kubernetes.io/part-of: aegis-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis-system
data:
  APP_NAME: "Aegis Agentic RAG Gateway"
  ENV: "production"
  LOG_LEVEL: "INFO"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_BASE_URL: "http://ollama-service.aegis-system.svc.cluster.local:11434"
  POSTGRES_HOST: "postgres-service.aegis-system.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aegis_db"
  REDIS_HOST: "redis-service.aegis-system.svc.cluster.local"
  REDIS_PORT: "6379"
  QDRANT_HOST: "qdrant-service.aegis-system.svc.cluster.local"
  QDRANT_PORT: "6333"

---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis-system
type: Opaque
stringData:
  POSTGRES_USER: "aegis_prod_user"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION_SECURE_PASS"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-api
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-api
        app.kubernetes.io/component: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegis-api
      containers:
        - name: aegis-api
          image: aegis-agentic-rag:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-secrets
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-api-service
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: aegis-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-api-hpa
  namespace: aegis-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-api-network-policy
  namespace: aegis-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aegis-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP from Ingress Controller / Service Mesh
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS Resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to PostgreSQL, Redis, Qdrant, and Ollama inside the cluster
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 11434